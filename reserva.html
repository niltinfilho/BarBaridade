<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bar-Baridade | Reserva</title>
    <link rel="stylesheet" href="assets/styles/style.css" />
    <link rel="stylesheet" href="assets/styles/reserva.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link
      rel="shortcut icon"
      href="assets/images/id/favicon-bar-baridade-96x96.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div id="header-root"></div>
    <div id="hero-subpage-root"></div>

    <section id="reserva-section">
      <div class="container flex form-wrapper">
        <div class="img-form"></div>
        <div class="form-content">
          <h2>Reserve sua mesa</h2>
          <p>
            Porque algumas noites merecem ser planejadas (e brindadas com
            estilo).
          </p>
          <form class="flex" id="form">
            <div>
              <label for="name">Nome completo*</label>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="Pra gente te chamar do jeito certo (e preparar seu lugar com carinho)"
                class="inputs required"
                oninput="nameValidate()"
              />
              <span class="span-required">
                O nome deve ter no mínimo 3 caracteres
              </span>
            </div>
            <div>
              <label for="telefone">Telefone / WhatsApp* (Apenas números)</label>
              <input
                type="tel"
                name="telefone"
                id="telefone"
                placeholder="Caso precise confirmar ou ajustar o horário do seu brinde"
                class="inputs required"
                onblur="mascaraDeTelefone(this)"
                oninput="telefoneValidate(this)"
              />
              <span class="span-required">
                O telefone deve ter no mínimo 8 caracteres
              </span>
            </div>
            <div>
              <label for="email">E-mail*</label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="Pra enviar a confirmação da reserva"
                class="inputs required"
                oninput="emailValidate()"
              />
              <span class="span-required">
                O e-mail deve ser válido
              </span>
            </div>
            <div class="form-two-columns flex">
              <div>
                <label for="data">Data da reserva*</label>
                <input
                  type="date"
                  name="data"
                  id="data"
                  placeholder="Escolha o dia da sua noite Bar-Baridade"
                  class="inputs required"
                  oninput="dataValidate()"
                />
                <span class="span-required">
                  A data da reserva deve ser válida
                </span>
              </div>
              <div>
                <label for="numero">Número de pessoas*</label>
                <input
                  type="number"
                  name="numero"
                  id="numero"
                  placeholder="Mais gente, mais brindes"
                  class="inputs required"
                  oninput="numeroValidate()"
                />
                <span class="span-required">
                  O número de pessoas deve ser maior ou igual a 1
                </span>
              </div>
            </div>
            <div>
              <button id="button" type="button" class="disabled" disabled onclick="sendWhatsapp()">
              Confirmar reserva
            </div>
          </form>
        </div>
      </div>
    </section>
    <section class="iframe-maps">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d467688.89495119266!2d-46.5952992!3d-23.6824124!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce448183a461d1%3A0x9ba94b08ff335bae!2zU8OjbyBQYXVsbywgU1A!5e0!3m2!1spt-BR!2sbr!4v1764451555763!5m2!1spt-BR!2sbr" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>
    <div id="sobre-root"></div>
    <div id="menu-root"></div>
    <div id="footer-root"></div>

    <script src="components/header/header.js"></script>
    <script src="components/hero-subpages/hero-subpages.js"></script>
    <script src="components/sobre/sobre.js"></script>
    <script src="components/menu/menu.js"></script>
    <script src="components/footer/footer.js"></script>
    <script src="assets/scripts/swiper.js"></script>
    <script src="assets/scripts/form.js"></script>
    <script src="assets/scripts/menu-hamburger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      CreateHeroSubpages(
        "Faça sua <span>reserva</span> agora",
        "No Bar Baridade, cada mesa é um convite pra viver uma experiência única: drinks autorais, boa música e aquele clima que transforma qualquer quinta em sexta."
      );
    </script>
  </body>
</html>
